; meowmap firmware, early prototype.
; Pinned to platform-espressif32 5.4.0, which resolves to Arduino-ESP32 2.0.6
; and the legacy I2S driver in driver/i2s.h. This build has not been flashed.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
